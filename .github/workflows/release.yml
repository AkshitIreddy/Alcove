name: Release

# Builds the Tauri bundle on Windows, macOS and Linux and attaches every
# artefact to one GitHub Release.
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# Nothing runs on an ordinary push — tag when you actually want a release, or
# dispatch this by hand against a tag that already exists.
#
# The shape is three jobs, not one matrix, and that is deliberate:
#
#   gates   — tsc, the fast logic gate, spec:check, readme:check and the icon audit, ONCE,
#             on the cheapest runner. None of them can fail differently on a
#             different operating system, so running them three times would buy
#             nothing and cost the slowest runner in the matrix.
#   build   — the three bundles, in parallel, each doing only what is
#             platform-specific.
#   release — one release, one set of notes, one checksum file.
#
# docs/packaging-mac-linux.md is the long version: what a first run is expected
# to produce, and what to check when it does.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.2.0)'
        required: true
      draft:
        description: 'Publish as a draft rather than live'
        type: boolean
        default: false

# Least privilege: only the job that publishes needs write.
permissions:
  contents: read

# Two runs against the same tag would race to create the same release. Queue
# them instead of cancelling — a half-published release is worse than a slow one.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  # Pinned to the version this repository is actually developed and verified on.
  # A release pipeline should build what somebody has run the tests against, not
  # whatever is newest — and 20 is past its LTS window, so this is a deliberate
  # one-line bump to make locally first and here second, never the other way
  # round. The gates job runs the whole suite on it before anything is built.
  NODE_VERSION: '20'

jobs:
  # ---------------------------------------------------------------------------
  # Everything that is true regardless of which OS is going to build the bundle.
  # ---------------------------------------------------------------------------
  gates:
    name: Gates (once)
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      # The tag arrives through env rather than being interpolated into the
      # script. A workflow_dispatch input is attacker-controlled the moment
      # anyone with write access is phished, and `${{ }}` inside a `run:` is
      # textual substitution into a shell — env is not.
      - name: Resolve the tag being released
        id: resolve
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "::error::'$TAG' is not a version tag (expected v*)"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.ref }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Caches ~/.npm (the download cache), keyed on package-lock.json.
          # NOT node_modules — `npm ci` deletes that directory before it
          # installs, so caching it restores something that is immediately
          # thrown away. The download cache is the part that saves the network.
          cache: npm

      # The feed version and the version inside the downloaded installer must
      # agree. Otherwise the old binary comes back after relaunch and offers
      # the same update forever.
      - name: Tag matches the bundled app version
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          node -e '
            const fs = require("node:fs");
            const version = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
            if (process.env.TAG !== `v${version}`) {
              throw new Error(`tag ${process.env.TAG} does not match bundled app version v${version}`);
            }
          '

      - name: Authored release note is ready
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: node scripts/release-notes.mjs "$TAG" --check

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Fast logic gate
        run: npm test

      - name: Generated spec is current
        run: npm run spec:check

      - name: README is current
        run: npm run readme:check

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      # This is the check that would have caught the reason this workflow
      # exists. icon.icns had been generated once by the Tauri CLI and never
      # again, so a macOS bundle would have shipped the artwork from two
      # renames ago. --check parses icon.ico and icon.icns off disk and
      # compares the largest .icns frame against assets/brand/alcove-art.png.
      - name: Icons are well-formed and current
        run: python scripts/gen-icons.py --check

  # ---------------------------------------------------------------------------
  # The bundles. Nothing here re-runs a gate.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.name }}
    needs: gates
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # NSIS setup.exe + WiX MSI. `installMode: currentUser`, so installing
          # asks for no administrator prompt. A SECOND setup.exe is built after
          # this one by the "offline installer" step below — see the comment
          # there, and docs/packaging-windows.md.
          - name: windows-x64
            os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            tauri-args: ''
            artefacts: |
              src-tauri/target/release/bundle/nsis/*-setup.exe
              src-tauri/target/release/bundle/nsis/*-setup.exe.sig
              src-tauri/target/release/bundle/nsis/*-setup-offline.exe
              src-tauri/target/release/bundle/msi/*.msi

          # ONE universal .dmg carrying BOTH slices, not two downloads and not a
          # choice the reader has to make. `--target universal-apple-darwin`
          # builds aarch64-apple-darwin and x86_64-apple-darwin and lipos them
          # into one binary, which is why both targets are installed below; the
          # runner is Apple silicon and cross-builds the Intel slice from the
          # same SDK. Output lands under target/universal-apple-darwin/release/,
          # NOT target/release/ — that is the path mistake to avoid.
          #
          # macos-15 is the arm64 label (macos-15-intel is the x64 one, and
          # macos-14 is deprecated). Any arm64 macOS runner works here, because
          # nothing about the build depends on the host arch once both Rust
          # targets are present.
          - name: macos-universal
            os: macos-15
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: '--target universal-apple-darwin'
            artefacts: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

          # 22.04 on purpose. The .deb and the AppImage are linked against the
          # builder's glibc, so building on 24.04 (glibc 2.39) would produce a
          # package that refuses to start on 22.04 (2.35). Build on the oldest
          # runner you are willing to support, never the newest.
          - name: linux-x64
            os: ubuntu-22.04
            rust-targets: x86_64-unknown-linux-gnu
            tauri-args: ''
            artefacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sig

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gates.outputs.ref }}

      # Tauri 2 on Linux is a system-library build, and the packages below are
      # not interchangeable guesses:
      #
      #   libwebkit2gtk-4.1-dev   the webview itself. Tauri *2* links 4.1;
      #                           4.0 is the v1 series, and installing that by
      #                           habit is the classic red Linux CI run.
      #   libgtk-3-dev            window, native menus, file dialogs.
      #   libayatana-appindicator3-dev
      #                           the tray icon — src-tauri/src/tray.rs is not
      #                           optional in this app, and without this the
      #                           link step fails rather than degrading.
      #   librsvg2-dev            rasterises the icon into the .desktop entry
      #                           and the AppImage.
      #   libxdo-dev              X11 input, wanted by plugin-global-shortcut.
      #   libssl-dev              OpenSSL headers for the transitive TLS stack.
      #   patchelf                the AppImage bundler rewrites RPATHs with it.
      #   build-essential/curl/wget/file
      #                           compiler, and the fetch+identify tools the
      #                           AppImage bundler shells out to.
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Caches ~/.cargo/{registry,git} and src-tauri/target, keyed on the
      # lockfile and the exact rustc. A cold Tauri build is several hundred
      # crates; warm, it is this crate and the link. `key` keeps the universal
      # macOS target directory from colliding with anything else.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      # Updater signatures are not Authenticode/notarisation. They are the
      # cryptographic proof the already-installed app requires before it will
      # run a downloaded update. The private half lives only in GitHub Actions;
      # the public half is embedded in tauri.conf.json.
      - name: Updater signing key is configured
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY repository secret before releasing"
            exit 1
          fi

      # The Rust unit tests, on one runner only.
      #
      # They had never run anywhere. The Gates job has no Rust in it — no
      # toolchain, and on Linux no webkit2gtk either, so putting them there
      # means installing a build environment to run 29 tests that take 0.06s.
      # Here the toolchain, the crates and a warm `target/` are already set up
      # for the build that is about to happen, so the marginal cost is the
      # compile of the test harness and nothing else.
      #
      # Windows only, because the tests are pure logic — archive path safety,
      # PDF structure, media hashing — and none of them touches a platform API.
      # Running them three times would buy nothing.
      #
      # It sits BEFORE `tauri build` so a failure costs the cheap half of the
      # job. That is still later than a gate should fire, and it is a stopgap:
      # this repository has no push or pull-request workflow at all, so nothing
      # checks an ordinary commit. Written down in TODO.md as the owner's call,
      # because a CI workflow spends their Actions minutes.
      - name: Rust unit tests
        if: matrix.name == 'windows-x64'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # `beforeBuildCommand` in tauri.conf.json runs `npm run build`, so the
      # frontend (spec:check + vite build) is built here per runner. That is the
      # one gate that does repeat across the matrix; it is seconds, and sharing
      # dist/ between jobs would cost more in upload than it saves.
      - name: Build the bundle
        shell: bash
        # NO_STRIP: binutils 2.38 on 22.04 strips the AppImage runtime in a way
        # that breaks it. Harmless everywhere else, so it is set unconditionally
        # rather than guarded, and can be dropped once that is no longer true.
        env:
          NO_STRIP: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build ${{ matrix.tauri-args }}

      # ---------------------------------------------------------------------
      # The second Windows installer: the one that needs no internet.
      #
      # Alcove renders in the Microsoft Edge WebView2 runtime, which is present
      # on any up-to-date Windows 11 and on most Windows 10 — but not all of
      # it, and the app cannot start without it. `webviewInstallMode` decides
      # what the installer does about that. Every mode was compiled from one
      # payload so the deltas are exact (bytes, 0.2.0, measured not guessed —
      # the method and the full reasoning are in docs/packaging-windows.md):
      #
      #   skip                   15,365,319   −10,181   installs, never paints
      #   downloadBootstrapper   15,375,500        —    the Tauri default
      #   embedBootstrapper      16,960,852   +10.31%  ← shipped as the default
      #   offlineInstaller     ~227,700,000   +~202 MiB, and it tracks Edge
      #   fixedRuntime           offline-sized, +849 MiB on disk, never updated
      #
      # embedBootstrapper carries Microsoft's 1.6 MB bootstrapper inside the
      # setup, so the installer never has to fetch anything itself; the
      # bootstrapper still pulls the runtime down if the machine lacks it. What
      # the 10% buys is not merely "one fewer hop" — it deletes the hop done by
      # NSISdl, which is proxy-blind and aborts the whole install when it
      # fails, and keeps the one done by Microsoft's updater, which honours the
      # system proxy. That is the case (corporate networks) where it decides
      # whether the install works at all.
      #
      # offlineInstaller carries the whole runtime. It is fifteen times the app
      # and there is no version of "small enough" that covers 200 MB, so it is
      # a SECOND, separately named download for machines that are genuinely
      # offline or behind a proxy that blocks Microsoft's CDN — never the one a
      # reader lands on by default. Note it is the ONLY mode that installs with
      # no internet: embedding the bootstrapper removes a download, not the
      # need for one.
      #
      # `--config` patches the checked-in config rather than editing it, so the
      # repository has exactly one webviewInstallMode and this file cannot
      # silently become the source of truth for it.
      # The second bundle writes to the SAME filename as the first, so the first
      # one is moved out of the way and moved back. `tauri bundle` deliberately
      # reuses the app binary produced above: unlike a second `tauri build`, it
      # does not compile/link Rust or rerun the frontend just to change an NSIS
      # payload setting. It still runs Tauri's beforeBundleCommand and the same
      # NSIS bundler over the complete offline WebView2 payload.
      - name: Build the offline installer (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: src-tauri/target/release/bundle
        run: |
          set -euo pipefail
          mkdir -p keep
          mv nsis/*-setup.exe keep/
          mv nsis/*-setup.exe.sig keep/
          cd "$GITHUB_WORKSPACE"
          npx tauri bundle --bundles nsis \
            --config '{"bundle":{"createUpdaterArtifacts":false,"windows":{"webviewInstallMode":{"type":"offlineInstaller","silent":true}}}}'
          cd src-tauri/target/release/bundle
          for f in nsis/*-setup.exe; do
            mv "$f" "nsis/$(basename "${f%-setup.exe}")-setup-offline.exe"
          done
          mv keep/*-setup.exe nsis/
          mv keep/*-setup.exe.sig nsis/
          rmdir keep
          ls -lh nsis

      # Diagnostic only — never the reason a build goes red, which is why it
      # swallows its own exit code. The upload step below is what actually
      # enforces that the files exist.
      - name: Show what was bundled
        shell: bash
        run: find src-tauri/target -type d -name bundle -exec ls -lhR {} + || true

      - name: Upload artefacts
        uses: actions/upload-artifact@v7
        with:
          name: alcove-${{ matrix.name }}
          path: ${{ matrix.artefacts }}
          # Without this a glob that matches nothing uploads an empty artefact
          # and the release publishes with a platform silently missing.
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # One release, assembled after all three bundles exist.
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: [gates, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gates.outputs.ref }}
          # release-notes.mjs links this tag to the previous one, so it needs
          # tags and enough history to resolve that comparison honestly.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download every platform's artefacts
        uses: actions/download-artifact@v8
        with:
          path: artefacts
          pattern: alcove-*
          merge-multiple: true

      - name: Write release notes
        env:
          TAG: ${{ needs.gates.outputs.tag }}
        run: |
          node scripts/release-notes.mjs "$TAG" > RELEASE_NOTES.md
          echo "--- notes ---"
          cat RELEASE_NOTES.md

      # `upload-artifact` roots each artefact at the LEAST COMMON ANCESTOR of
      # the paths it was given, so the shape of the download depends on how many
      # directories a platform's bundles came from:
      #
      #   macOS  — one file from bundle/dmg/            -> arrives FLAT
      #   Windows — bundle/nsis/*.exe + bundle/msi/*.msi -> arrives as nsis/, msi/
      #   Linux  — deb/, rpm/, appimage/                 -> arrives as three dirs
      #
      # That published v0.2.0 with ONE asset. `sha256sum *` hashed the lone flat
      # file and errored on the directories, and `files: artefacts/*` could only
      # upload a file — so the .dmg went out and the Windows and Linux bundles,
      # both uploaded successfully by their jobs, silently did not.
      # `fail_on_unmatched_files: true` did not catch it: the glob matched
      # something, just not everything.
      - name: Flatten, and prove every platform is present
        working-directory: artefacts
        run: |
          find . -mindepth 2 -type f -exec mv -n -t . {} +
          find . -mindepth 1 -type d -empty -delete
          echo "--- what will be published ---"
          ls -lh

          # The check that would have caught the one-asset release. Each pattern
          # is a platform a reader was promised on the download table, so a
          # missing one is a broken promise rather than a smaller release.
          missing=''
          for pattern in '*-setup.exe' '*-setup.exe.sig' '*-setup-offline.exe' '*.msi' '*.dmg' '*.app.tar.gz' '*.app.tar.gz.sig' '*.deb' '*.rpm' '*.AppImage' '*.AppImage.sig'; do
            # shellcheck disable=SC2086
            set -- $pattern
            [ -e "$1" ] || missing="$missing $pattern"
          done
          if [ -n "$missing" ]; then
            echo "::error::no artefact matched:$missing — the release would have shipped incomplete"
            exit 1
          fi

      # `latest.json` is the stable endpoint embedded in every installed copy
      # of Alcove. Its URLs point at this immutable tag, and its signatures are
      # the contents of the `.sig` files rather than links to them.
      - name: Write signed updater manifest
        env:
          TAG: ${{ needs.gates.outputs.tag }}
        run: |
          node scripts/write-updater-json.mjs \
            --dir artefacts \
            --tag "$TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --notes RELEASE_NOTES.md

      - name: Prove updater metadata is complete
        working-directory: artefacts
        run: |
          node -e '
            const fs = require("node:fs");
            const feed = JSON.parse(fs.readFileSync("latest.json", "utf8"));
            for (const platform of ["windows-x86_64", "linux-x86_64", "darwin-aarch64", "darwin-x86_64"]) {
              const item = feed.platforms?.[platform];
              if (!item?.url || !item?.signature) throw new Error(`incomplete updater entry: ${platform}`);
            }
          '

      # The updater signatures prove update authenticity to Alcove. Checksums
      # remain useful to humans manually downloading the unsigned-code bundles.
      - name: Checksums
        working-directory: artefacts
        run: |
          sha256sum ./* | sed 's| \./| |' | tee SHA256SUMS.txt

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.gates.outputs.tag }}
          name: Alcove ${{ needs.gates.outputs.tag }}
          body_path: RELEASE_NOTES.md
          draft: ${{ github.event.inputs.draft == 'true' }}
          # A tag with a hyphen in it is a prerelease: v0.2.0-beta.1.
          prerelease: ${{ contains(needs.gates.outputs.tag, '-') }}
          fail_on_unmatched_files: true
          files: artefacts/*
