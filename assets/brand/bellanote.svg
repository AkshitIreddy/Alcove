<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    Bellanote — the app mark.

    Same vocabulary as everything the app draws (src/art/flat.ts): flat colour,
    ONE dark outline on everything, rounded corners, edges that bow a little.
    Gentle two-stop ramps are allowed; a light model is not.

    ## The idea, and the seven passes it took

    A notebook with a bell on its bookmark. Every pass was the same question —
    what is the bell attached to, and does the attachment look real?

      1. A green ribbon down the cover — read as an object taped on.
      2. An open gold arc — read as a stray "C" floating on the cover.
      3. A closed gold ring — a blob at 32px, fussy jewellery at 1024.
      4. A red cord wrapped round the book. It finally answered "attached to
         WHAT", but it crossed the label, and moved to the fore edge it read as
         a pole strapped on.
      5. A ribbon out of the TOP of the pages. Correct object, wrong physics:
         a ribbon standing straight up is an antenna. Nothing hangs upward.

    This is the version with gravity in it. The bookmark leaves the pages at
    the BOTTOM, which is where a ribbon in a standing book actually emerges,
    and the bell's weight is doing visible work: the ribbon is a tapering
    fabric shape rather than a stroke of constant width, it sways off vertical
    instead of dropping like a plumb line, and it carries one fold where the
    cloth turns. The bell hangs slightly off-axis, the way a weight on a soft
    ribbon rests rather than balances.

    Proportion is ~0.68 of the height. An earlier chase after "cute" had it at
    0.86, which stopped reading as a book and started reading as a lunchbox.

    Detail that survives 32px as a single mark: gold corner protectors on the
    fore edge, a stitched line inset from the cover, two fat spine bands, and a
    label with two chunky strokes.
  -->
  <defs>
    <linearGradient id="cover" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#6d81cf"/>
      <stop offset="58%" stop-color="#5468b4"/>
      <stop offset="100%" stop-color="#3f5195"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#374780"/>
      <stop offset="100%" stop-color="#51649f"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#efe7d4"/>
      <stop offset="100%" stop-color="#fffaf0"/>
    </linearGradient>
    <linearGradient id="bell" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffe49b"/>
      <stop offset="100%" stop-color="#f0ad33"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bf3a2c"/>
      <stop offset="55%" stop-color="#dd5240"/>
      <stop offset="100%" stop-color="#ee6d58"/>
    </linearGradient>
  </defs>

  <!-- one flat contact shadow under the BOOK, never a light model -->
  <ellipse cx="486" cy="778" rx="248" ry="34" fill="#2c2a4a" opacity="0.2"/>

  <g transform="translate(0 -34) rotate(-3 500 470)">

    <!-- ============================ the book ============================ -->

    <!-- page block: behind the cover, proud on the fore edge -->
    <path d="M 330 196
             C 456 182, 634 186, 740 198
             C 758 201, 768 213, 770 232
             C 776 356, 778 576, 772 700
             C 770 719, 760 729, 742 732
             C 626 744, 452 746, 332 738 Z"
          fill="url(#pages)" stroke="#2c2a4a" stroke-width="15" stroke-linejoin="round"/>
    <path d="M 748 254 C 754 370, 756 560, 750 668" fill="none" stroke="#d3cab2" stroke-width="9" opacity="0.9"/>

    <!-- front cover -->
    <path d="M 258 170
             C 277 150, 308 141, 342 139
             C 470 130, 596 133, 668 143
             C 701 148, 716 169, 718 202
             C 726 356, 728 596, 720 728
             C 718 761, 702 780, 669 785
             C 562 796, 436 797, 336 789
             C 301 786, 276 776, 258 756 Z"
          fill="url(#cover)" stroke="#2c2a4a" stroke-width="18" stroke-linejoin="round"/>

    <!-- stitched line, inset from the cover edge -->
    <path d="M 376 190
             C 478 183, 592 185, 660 192
             C 672 194, 678 201, 679 213
             C 685 358, 686 588, 679 712
             C 678 724, 671 731, 659 733
             C 569 742, 442 743, 362 735
             C 350 733, 344 726, 343 714
             C 337 582, 337 350, 342 210
             C 343 198, 364 191, 376 190 Z"
          fill="none" stroke="#93a6e0" stroke-width="6" stroke-dasharray="16 14" stroke-linecap="round" opacity="0.75"/>

    <!-- spine: the darker face doing all the depth work -->
    <path d="M 258 170
             C 229 201, 216 239, 214 285
             C 209 414, 209 514, 214 644
             C 216 688, 229 731, 258 756
             C 276 776, 301 786, 336 789
             C 314 762, 307 733, 305 695
             C 300 577, 300 363, 305 245
             C 307 207, 317 187, 342 139
             C 308 141, 277 150, 258 170 Z"
          fill="url(#spine)" stroke="#2c2a4a" stroke-width="18" stroke-linejoin="round"/>

    <!-- two fat butter bands on the spine -->
    <path d="M 302 316 C 285 318, 241 320, 226 318" fill="none" stroke="#ffd782" stroke-width="27" stroke-linecap="round"/>
    <path d="M 301 610 C 284 612, 240 614, 225 612" fill="none" stroke="#ffd782" stroke-width="27" stroke-linecap="round"/>

    <!-- gold corner protectors on the fore edge -->
    <path d="M 668 147 C 694 151, 712 169, 715 196 C 697 192, 679 178, 668 147 Z"
          fill="#ffd782" stroke="#2c2a4a" stroke-width="12" stroke-linejoin="round"/>
    <path d="M 717 738 C 714 765, 698 781, 672 784 C 683 757, 700 742, 717 738 Z"
          fill="#ffd782" stroke="#2c2a4a" stroke-width="12" stroke-linejoin="round"/>

    <!-- a cream label with two chunky marks on it -->
    <path d="M 392 322
             C 462 314, 556 316, 613 323
             C 629 325, 636 335, 637 351
             C 640 399, 640 450, 637 492
             C 636 508, 627 517, 611 519
             C 542 527, 441 527, 396 521
             C 380 519, 372 510, 371 494
             C 368 450, 368 397, 371 353
             C 372 337, 380 323, 392 322 Z"
          fill="#fffaf0" stroke="#2c2a4a" stroke-width="14" stroke-linejoin="round"/>
    <path d="M 418 382 C 466 375, 544 376, 596 382" fill="none" stroke="#5a5a86" stroke-width="20" stroke-linecap="round" opacity="0.85"/>
    <path d="M 418 446 C 458 440, 520 441, 558 446" fill="none" stroke="#5a5a86" stroke-width="18" stroke-linecap="round" opacity="0.55"/>

    <!-- ====================== the bookmark and bell ======================
         A tapering fabric shape, not a stroke of constant width. It leaves the
         pages at the bottom — where a ribbon in a standing book actually comes
         out — sways off vertical instead of dropping like a plumb line, and
         carries one fold where the cloth turns. All of that is the bell's
         weight doing visible work; a rigid vertical line reads as a stick. -->
    <path d="M 646 700
             C 664 700, 680 704, 690 710
             C 686 762, 676 806, 660 846
             C 652 866, 648 884, 650 902
             C 636 908, 618 908, 604 902
             C 604 882, 610 862, 620 842
             C 636 806, 645 760, 646 700 Z"
          fill="url(#ribbon)" stroke="#2c2a4a" stroke-width="14" stroke-linejoin="round"/>
    <!-- the fold: one flat darker face where the cloth turns, the same depth
         trick the spine uses -->
    <path d="M 660 846 C 652 866, 648 884, 650 902 C 643 905, 636 906, 629 906
             C 628 886, 634 864, 645 842 Z"
          fill="#a82f23" stroke="#2c2a4a" stroke-width="12" stroke-linejoin="round"/>

    <!-- the bell, hanging slightly off-axis the way a weight on soft ribbon
         rests rather than balances -->
    <g transform="rotate(7 626 960)">
      <path d="M 566 962
               C 554 912, 578 866, 626 858
               C 674 850, 708 886, 713 936
               C 715 958, 723 972, 735 980
               C 740 985, 737 994, 728 996
               C 672 1004, 604 1006, 554 999
               C 545 998, 541 988, 547 983
               C 560 975, 564 971, 566 962 Z"
            fill="url(#bell)" stroke="#2c2a4a" stroke-width="16" stroke-linejoin="round"/>
      <path d="M 596 918 C 603 886, 618 869, 640 866" fill="none" stroke="#fff4d2" stroke-width="14" stroke-linecap="round" opacity="0.8"/>
      <!-- the clapper. Small, but it is what makes the silhouette read as a
           BELL rather than a lampshade once the mark is 32px across. -->
      <circle cx="641" cy="1013" r="21" fill="#f0ad33" stroke="#2c2a4a" stroke-width="14"/>
    </g>
  </g>
</svg>
