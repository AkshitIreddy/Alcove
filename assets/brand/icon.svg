    <!-- gilt bands -->
    <path d="M 205 236 C 187 238, 128 240, 112 238" fill="none" stroke="#e8b64c" stroke-width="25" stroke-linecap="round" opacity="0.92"/>
    <path d="M 206 310 C 188 312, 131 314, 114 312" fill="none" stroke="#e8b64c" stroke-width="14" stroke-linecap="round" opacity="0.75"/>
    <path d="M 204 772 C 186 774, 128 776, 112 774" fill="none" stroke="#e8b64c" stroke-width="25" stroke-linecap="round" opacity="0.92"/>

    <!-- ornamental frame on cover: double wobbly line + corner dots -->
    <path d="M 300 128
             C 452 118, 630 120, 742 130
             C 752 131, 757 137, 758 147
             C 765 372, 766 640, 759 850
             C 758 860, 753 866, 743 867
             C 620 877, 452 878, 306 870
             C 296 869, 291 863, 290 853
             C 283 636, 283 380, 289 146
             C 289 136, 294 129, 300 128 Z"
          fill="none" stroke="#f0d9a8" stroke-width="9" opacity="0.85"/>
    <circle cx="313" cy="152" r="9" fill="#f0d9a8" opacity="0.8"/>
    <circle cx="735" cy="155" r="9" fill="#f0d9a8" opacity="0.8"/>
    <circle cx="313" cy="843" r="9" fill="#f0d9a8" opacity="0.8"/>
    <circle cx="733" cy="840" r="9" fill="#f0d9a8" opacity="0.8"/>

    <!-- cream label with scribbles -->
    <path d="M 356 330
             C 452 322, 606 324, 690 331
             C 706 332, 715 342, 716 358
             C 720 416, 720 476, 716 524
             C 715 540, 705 549, 689 551
             C 596 559, 448 559, 362 552
             C 346 551, 337 541, 336 525
             C 332 472, 332 408, 336 356
             C 337 340, 342 331, 356 330 Z"
          fill="#f7f1e3" stroke="#4f3120" stroke-width="11"/>
    <path d="M 392 398 C 448 391, 574 392, 660 398" fill="none" stroke="#6b4a32" stroke-width="15" stroke-linecap="round" opacity="0.85"/>
    <path d="M 392 452 C 440 445, 536 446, 600 452" fill="none" stroke="#6b4a32" stroke-width="13" stroke-linecap="round" opacity="0.6"/>
    <path d="M 392 500 C 434 495, 500 496, 540 500" fill="none" stroke="#6b4a32" stroke-width="13" stroke-linecap="round" opacity="0.4"/>

    <!-- medallion under label -->
    <path d="M 512 640 L 542 690 L 512 740 L 482 690 Z"
          fill="none" stroke="#e8b64c" stroke-width="10" stroke-linejoin="round" opacity="0.85"/>
    <circle cx="512" cy="690" r="8" fill="#e8b64c" opacity="0.85"/>

    <!-- moss ribbon -->
    <path d="M 610 958
             C 609 992, 608 1010, 610 1030
             C 611 1042, 617 1045, 626 1039
             C 637 1031, 646 1031, 656 1038
             C 665 1045, 672 1042, 672 1030
             C 673 1006, 672 986, 670 958 Z"
          fill="#7d915c" stroke="#4f6138" stroke-width="11" stroke-linejoin="round"/>
  </g>
</svg>
