<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d88157"/>
      <stop offset="55%" stop-color="#c96f4a"/>
      <stop offset="100%" stop-color="#ad5738"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9c4a2b"/>
      <stop offset="100%" stop-color="#b85f3c"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eee2c8"/>
      <stop offset="100%" stop-color="#f9f3e2"/>
    </linearGradient>
  </defs>

  <!-- soft cast shadow -->
  <ellipse cx="520" cy="962" rx="380" ry="52" fill="#5d3a26" opacity="0.28"/>

  <g transform="rotate(-4 512 512)">
    <!-- page block -->
    <path d="M 232 96
             C 430 78, 700 82, 848 96
             C 870 98, 881 110, 883 132
             C 892 400, 894 690, 885 906
             C 883 928, 872 939, 850 941
             C 680 953, 430 956, 242 946 Z"
          fill="url(#pageGrad)" stroke="#5d3a26" stroke-width="13" stroke-linejoin="round"/>
    <path d="M 860 176 C 867 400, 869 700, 862 862" fill="none" stroke="#cbb890" stroke-width="9" opacity="0.9"/>
    <path d="M 834 170 C 842 406, 843 696, 836 872" fill="none" stroke="#cbb890" stroke-width="8" opacity="0.7"/>
    <path d="M 809 166 C 816 410, 817 700, 812 878" fill="none" stroke="#cbb890" stroke-width="8" opacity="0.5"/>

    <!-- front cover -->
    <path d="M 165 52
             C 186 38, 218 31, 254 30
             C 452 17, 664 20, 776 33
             C 808 37, 823 55, 825 87
             C 836 360, 838 714, 827 918
             C 825 950, 809 967, 777 970
             C 611 984, 403 986, 240 975
             C 198 973, 173 968, 155 954 Z"
          fill="url(#coverGrad)" stroke="#4f3120" stroke-width="16" stroke-linejoin="round"/>

    <!-- spine -->
    <path d="M 165 52
             C 126 84, 108 127, 106 187
             C 99 431, 99 643, 106 833
             C 108 890, 126 928, 155 954
