<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Painted rendering harness</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        background: #14100c;
        color: #e8ddc9;
        font: 13px/1.4 ui-sans-serif, system-ui, sans-serif;
      }
      #bar {
        position: fixed; inset: 0 0 auto 0; z-index: 10;
        display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
        padding: 8px 12px; background: #1d1710ee; border-bottom: 1px solid #3a2f22;
      }
      #bar button {
        background: #2b2216; color: #e8ddc9; border: 1px solid #4a3b28;
        border-radius: 4px; padding: 4px 10px; cursor: pointer; font: inherit;
      }
      #bar button:hover { background: #3d3020; }
      #stage { padding: 52px 12px 24px; }
      canvas { display: block; image-rendering: auto; box-shadow: 0 8px 40px #0009; }
      #status { opacity: .7; margin-left: auto; }
    </style>
  </head>
  <body>
    <div id="bar"><span id="status">booting…</span></div>
    <div id="stage"><canvas id="cv" width="900" height="500"></canvas></div>
    <script src="./bundle.js" defer></script>
  </body>
</html>
