<!doctype html>
<html>
<head><meta charset="utf-8"><style>
  body { background:#f7f1e3; margin:0; padding:24px; font-family:system-ui; }
  .row { display:flex; gap:18px; flex-wrap:wrap; }
  figure { margin:0; background:#fffdf7; padding:10px 10px 6px; border:2px solid #4f3120; border-radius:6px; }
  figcaption { font-size:13px; color:#4f3120; text-align:center; padding-top:6px; }
  svg { display:block; width:180px; height:150px; }
</style></head>
<body>
<div class="row">

<figure><svg viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
  <rect x="1" y="1" width="118" height="98" rx="8" fill="#f3e4c8"/>
  <!-- tail -->
  <path d="M80 88 C 98 88 104 70 95 61 C 90 56 83 58 82 63 C 81 68 87 70 89 66"
        fill="none" stroke="#4f3120" stroke-width="7" stroke-linecap="round"/>
  <path d="M80 88 C 98 88 104 70 95 61 C 90 56 83 58 82 63 C 81 68 87 70 89 66"
        fill="none" stroke="#d98a4a" stroke-width="3.4" stroke-linecap="round"/>
  <!-- body -->
  <path d="M38 90 C 36 76 42 62 60 62 C 78 62 84 76 82 90 C 68 93 52 93 38 90 Z"
        fill="#d98a4a" stroke="#4f3120" stroke-width="3.2" stroke-linejoin="round"/>
  <path d="M44 91 C 44 84 56 84 56 91 Z M64 91 C 64 84 76 84 76 91 Z"
        fill="#e79a58" stroke="#4f3120" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- ears (behind the head, so only the tips show) -->
  <path d="M40 34 L 36 10 L 58 24 Z" fill="#d98a4a" stroke="#4f3120" stroke-width="3.2" stroke-linejoin="round"/>
  <path d="M80 34 L 84 10 L 62 24 Z" fill="#d98a4a" stroke="#4f3120" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- head -->
  <path d="M60 22 C 80 22 90 32 90 46 C 90 60 78 68 60 68 C 42 68 30 60 30 46 C 30 32 40 22 60 22 Z"
        fill="#e79a58" stroke="#4f3120" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- forehead stripes -->
  <path d="M52 28 L 54 34 M60 26 L 60 33 M68 28 L 66 34" stroke="#4f3120" stroke-width="2.6" stroke-linecap="round"/>
  <!-- eyes + nose -->
  <path d="M45 46 C 47 41 52 41 54 46" fill="none" stroke="#4f3120" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M66 46 C 68 41 73 41 75 46" fill="none" stroke="#4f3120" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M56 52 L 64 52 L 60 57 Z" fill="#4f3120"/>
  <path d="M60 57 C 57 61 53 60 52 58 M60 57 C 63 61 67 60 68 58"
        fill="none" stroke="#4f3120" stroke-width="2.2" stroke-linecap="round"/>
  <!-- whiskers -->
  <path d="M22 46 L 38 50 M22 54 L 38 55 M98 46 L 82 50 M98 54 L 82 55"
        stroke="#4f3120" stroke-width="2" stroke-linecap="round"/>
</svg><figcaption>a) sitting ginger</figcaption></figure>

<figure><svg viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
  <rect x="1" y="1" width="118" height="98" rx="8" fill="#dfe9ee"/>
  <!-- zzz -->
  <path d="M78 22 L 92 22 L 78 36 L 92 36" fill="none" stroke="#4f3120" stroke-width="2.8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M97 8 L 106 8 L 97 17 L 106 17" fill="none" stroke="#4f3120" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- curled body -->
  <path d="M18 70 C 18 48 40 40 62 42 C 88 44 102 56 98 72 C 95 86 66 92 44 90 C 26 88 18 80 18 70 Z"
        fill="#9aa7b0" stroke="#4f3120" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- tail laid round the front -->
  <path d="M97 76 C 88 88 62 90 46 85 C 40 83 41 76 47 77"
        fill="none" stroke="#4f3120" stroke-width="6.4" stroke-linecap="round"/>
  <path d="M97 76 C 88 88 62 90 46 85 C 40 83 41 76 47 77"
        fill="none" stroke="#b9c4cc" stroke-width="3" stroke-linecap="round"/>
  <!-- ears -->
  <path d="M28 54 L 22 34 L 42 44 Z" fill="#9aa7b0" stroke="#4f3120" stroke-width="3" stroke-linejoin="round"/>
  <path d="M56 52 L 62 33 L 44 42 Z" fill="#9aa7b0" stroke="#4f3120" stroke-width="3" stroke-linejoin="round"/>
  <!-- head tucked in -->
  <path d="M42 40 C 56 40 64 48 64 58 C 64 68 54 74 42 74 C 30 74 20 68 20 58 C 20 48 28 40 42 40 Z"
        fill="#b9c4cc" stroke="#4f3120" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- shut eyes + nose -->
  <path d="M28 56 C 31 61 35 61 38 56 M46 56 C 49 61 53 61 56 56"
        fill="none" stroke="#4f3120" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M39 62 L 45 62 L 42 66 Z" fill="#4f3120"/>
</svg><figcaption>b) asleep</figcaption></figure>

<figure><svg viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
  <rect x="1" y="1" width="118" height="98" rx="8" fill="#efe3d0"/>
  <!-- ears -->
  <path d="M42 30 L 38 8 L 58 22 Z" fill="#f0dcbb" stroke="#4f3120" stroke-width="3" stroke-linejoin="round"/>
  <path d="M78 30 L 82 8 L 62 22 Z" fill="#f0dcbb" stroke="#4f3120" stroke-width="3" stroke-linejoin="round"/>
  <!-- head -->
  <path d="M60 18 C 76 18 86 28 86 40 C 86 52 74 58 60 58 C 46 58 34 52 34 40 C 34 28 44 18 60 18 Z"
        fill="#f0dcbb" stroke="#4f3120" stroke-width="3.2" stroke-linejoin="round"/>
  <circle cx="50" cy="38" r="3.4" fill="#4f3120"/>
  <circle cx="70" cy="38" r="3.4" fill="#4f3120"/>
  <path d="M56 45 L 64 45 L 60 50 Z" fill="#4f3120"/>
  <path d="M26 36 L 40 40 M26 44 L 40 44 M94 36 L 80 40 M94 44 L 80 44"
        stroke="#4f3120" stroke-width="2" stroke-linecap="round"/>
  <!-- box, drawn over the chin so the cat is IN it -->
  <path d="M16 58 L 104 58 L 97 93 L 23 93 Z" fill="#d9b483" stroke="#4f3120" stroke-width="3.2" stroke-linejoin="round"/>
  <path d="M16 58 L 4 46 L 30 46 L 42 58 Z" fill="#e6c79b" stroke="#4f3120" stroke-width="3" stroke-linejoin="round"/>
  <path d="M104 58 L 116 46 L 90 46 L 78 58 Z" fill="#e6c79b" stroke="#4f3120" stroke-width="3" stroke-linejoin="round"/>
  <!-- paws hooked over the rim -->
  <path d="M44 58 C 44 52 53 52 53 58 Z" fill="#f0dcbb" stroke="#4f3120" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M67 58 C 67 52 76 52 76 58 Z" fill="#f0dcbb" stroke="#4f3120" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M30 70 L 90 70" stroke="#4f3120" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>
</svg><figcaption>c) in a box</figcaption></figure>

</div>
</body>
</html>
