<!doctype html>
<!--
  shots-now/readme-hero.html — the README's masthead, drawn in the app's own
  vocabulary and rendered to docs/readme/img/hero.png by readme-hero.mjs.

  Colours are lifted verbatim from src/styles/tokens.css; type is the app's own
  bundled families. Flat fills, ONE ink outline, rounded corners, no light
  model — the same rules the shelf is drawn under, so the README's first screen
  and the app's first screen are the same drawing.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Caveat';
        src: url('../node_modules/@fontsource-variable/caveat/files/caveat-latin-wght-normal.woff2')
          format('woff2-variations');
        font-weight: 400 700;
      }
      @font-face {
        font-family: 'Patrick Hand';
        src: url('../node_modules/@fontsource/patrick-hand/files/patrick-hand-latin-400-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'Kalam';
        src: url('../node_modules/@fontsource/kalam/files/kalam-latin-400-normal.woff2')
          format('woff2');
      }

      :root {
        --paper-cream: #f7f1e3;
        --paper-aged: #eee2c8;
        --paper-deep: #e0cfaa;
        --wall: #e9e2d0;
        --timber: #c08a52;
        --timber-dark: #9d6b3c;
        --recess: #7d5638;
        --ink: #4f3120;
        --ink-soft: #6b4a32;
        --amber: #e8b64c;
        --terracotta: #c96f4a;
        --terracotta-deep: #a8552f;
        --moss: #7d915c;
        --moss-deep: #4f6138;
        --sky: #5f7d8c;
        --blush: #bd7791;
        --plum: #8a5a72;
        --lemon: #dfc451;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        width: 1040px;
        height: 420px;
        background: var(--wall);
        font-family: 'Patrick Hand', system-ui;
        position: relative;
        overflow: hidden;
      }

      /* The wall behind everything: a flat ground with the faintest pinstripe,
         the same trick the wallpaper tile plays at its quietest setting. */
      .wall {
        position: absolute;
        inset: 0;
        background:
          repeating-linear-gradient(
            90deg,
            var(--wall) 0 13px,
            #e3dbc6 13px 14px
          );
      }

      .card {
        position: absolute;
        left: 44px;
        top: 34px;
        right: 44px;
        bottom: 92px;
        background: var(--paper-cream);
        border: 3px solid var(--ink);
        border-radius: 26px;
        display: flex;
        align-items: center;
        gap: 30px;
        padding: 0 40px;
        /* One flat contact shadow, offset — a hard second face, never a blur. */
        box-shadow: 9px 9px 0 0 #d8cdb2, 9px 9px 0 3px var(--ink);
      }

      /*
        Two separate causes made one box, and fixing either alone leaves it.

        1. The frame. This used to carry a 22px radius, a 3px ink border and a
           paper fill. Two rounded rectangles at slightly different radii leave
           four pale slivers where the outer corner clears the inner one.
        2. The source. `alcove-art.png` is the SUPPLIED master — RGB, no alpha
           at all, with a solid #fdfdfd surround baked in. Against the card's
           #f7f1e3 that surround reads as four white corners, which is what the
           reader photographed: "the icon in the above picture seems to have
           white background while everything else is a different white".

        So: no frame, and the source is `alcove-1024.png` — the same master
        after `scripts/gen-icons.py`'s `unframe()` has flooded the surround to
        alpha 0. Corners genuinely transparent, verified (0,0,0,0) at all four.
        Point this at alcove-art.png again and the box comes straight back.
      */
      .mark {
        width: 168px;
        height: 168px;
        object-fit: contain;
        flex: none;
      }

      .words { flex: 1; }

      h1 {
        font-family: 'Caveat', cursive;
        font-size: 92px;
        font-weight: 700;
        line-height: 0.98;
        color: var(--ink);
        letter-spacing: 0.5px;
      }

      .tag {
        font-size: 27px;
        color: var(--ink-soft);
        margin-top: 6px;
        line-height: 1.28;
      }

      .chips {
        display: flex;
        gap: 9px;
        margin-top: 16px;
      }
      .chip {
        font-family: 'Kalam', cursive;
        font-size: 17px;
        color: var(--ink);
        border: 2px solid var(--ink);
        border-radius: 999px;
        padding: 3px 14px 5px;
        background: var(--paper-aged);
        /* A chip that wraps is two lines inside one pill and reads as a
           mistake. Pin them to one line — if they no longer fit, the answer is
           one chip fewer, not a chip folded in half. */
        white-space: nowrap;
      }
      .chip.a { background: #f7e6bb; }
      .chip.b { background: #dfe7cd; }
      .chip.c { background: #f4d9c8; }
      .chip.d { background: #d9e4ea; }

      /* A strip of washi tape holding the card to the wall — the app puts one
         on a block; the README wears one too. */
      .washi {
        position: absolute;
        left: 78px;
        top: 10px;
        width: 168px;
        height: 40px;
        transform: rotate(-3.5deg);
        background: repeating-linear-gradient(
          -45deg,
          #f4d9c8 0 9px,
          #e6bda6 9px 18px
        );
        border: 2px solid var(--ink);
        border-radius: 4px;
        opacity: 0.96;
      }

      /* The plank the whole thing stands on, with six spines: the shelf, in
         miniature, in the six cloths a room is allowed. */
      .shelf {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 92px;
      }
      .spines {
        position: absolute;
        bottom: 27px;
        right: 74px;
        display: flex;
        align-items: flex-end;
        gap: 5px;
      }
      .spine {
        width: 21px;
        border: 2.5px solid var(--ink);
        border-radius: 5px 5px 3px 3px;
        position: relative;
      }
      .spine i {
        position: absolute;
        left: 3px;
        right: 3px;
        top: 24%;
        height: 11px;
        border: 2px solid var(--ink);
        border-radius: 3px;
        background: var(--paper-aged);
      }
      .plank {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 12px;
        height: 16px;
        background: var(--timber);
        border: 3px solid var(--ink);
        border-radius: 6px;
      }
      .plank::after {
        content: '';
        position: absolute;
        left: -3px;
        right: -3px;
        bottom: -11px;
        height: 8px;
        background: var(--timber-dark);
        border: 3px solid var(--ink);
        border-radius: 0 0 6px 6px;
      }
    </style>
  </head>
  <body>
    <div class="wall"></div>

    <div class="card">
      <img class="mark" src="../assets/brand/alcove-1024.png" alt="" />
      <div class="words">
        <h1>Alcove</h1>
        <div class="tag">
          A notebook that lives on a bookshelf.<br />
          Windows, macOS and Linux &middot; everything stays on your machine.
        </div>
        <!--
          Four chips is what the width takes at this size, so the fifth had to
          earn its place and "no account" could not: the line directly above
          already says everything stays on your machine. "Paste from any AI" is
          the one thing a reader cannot guess from a picture of a bookshelf.
        -->
        <div class="chips">
          <span class="chip a">endless shelf</span>
          <span class="chip b">block editor</span>
          <span class="chip c">pages that flow</span>
          <span class="chip d">paste from any AI</span>
        </div>
      </div>
    </div>
    <div class="washi"></div>

    <div class="shelf">
      <div class="spines">
        <div class="spine" style="height: 40px; background: #c96f4a"><i></i></div>
        <div class="spine" style="height: 50px; background: #7d915c"><i></i></div>
        <div class="spine" style="height: 36px; background: #5f7d8c"><i></i></div>
        <div class="spine" style="height: 47px; background: #8a5a72"><i></i></div>
        <div class="spine" style="height: 42px; background: #dfc451"><i></i></div>
        <div class="spine" style="height: 52px; background: #e8b64c"><i></i></div>
      </div>
      <div class="plank"></div>
    </div>
  </body>
</html>
