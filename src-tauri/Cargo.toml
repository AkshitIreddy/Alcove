[package]
name = "alcove"
version = "0.7.5"
description = "Alcove — a storybook library for notes, diagrams, tape, and stickers"
authors = ["Akshit"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "alcove_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
# Keep sqlite-vec inside the same SQLite process used by SQLx/plugin-sql.  The
# direct libsqlite3-sys pin deliberately matches sqlx-sqlite 0.8.6; a second
# SQLite ABI would make sqlite3_auto_extension register against the wrong
# engine on Windows.
libsqlite3-sys = "=0.30.1"
sqlite-vec = "=0.1.9"
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
scraper = "0.27.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
zip = { version = "5", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
base64 = "0.22"
gif = { version = "0.14", default-features = false, features = ["std"] }
httpdate = "1"
keyring = "4.1.6"
pdf-extract = "0.12"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "sync", "time"] }
zeroize = "1"
